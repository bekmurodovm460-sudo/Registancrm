<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Davomat · Registan Globus</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F4F0; --card: #FFFFFF; --ink: #0F1F45; --muted: #6B7280; --line: #E7E3DC;
    --ok: #16A34A; --ok-soft: #DCFCE7; --warn: #D97706; --warn-soft: #FEF3C7; --bad: #DC2626; --bad-soft: #FEE2E2;
    --none: #94A3B8; --none-soft: #EEF2F6; --accent: #F2642A; --navy: #0F1F45; --shadow: 0 6px 24px rgba(15, 31, 69, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1324; --card: #131D33; --ink: #EEF2FF; --muted: #93A0B8; --line: #22304D;
      --ok-soft: rgba(22,163,74,.18); --warn-soft: rgba(217,119,6,.2); --bad-soft: rgba(220,38,38,.2); --none-soft: rgba(148,163,184,.16); --shadow: 0 6px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1324; --card: #131D33; --ink: #EEF2FF; --muted: #93A0B8; --line: #22304D;
    --ok-soft: rgba(22,163,74,.18); --warn-soft: rgba(217,119,6,.2); --bad-soft: rgba(220,38,38,.2); --none-soft: rgba(148,163,184,.16); --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, -apple-system, sans-serif; }
  body { padding: 0 16px 32px; min-height: 100vh; overflow-x: hidden; }
  .hero { margin: 0 -16px; padding: 18px 16px 54px; background: linear-gradient(135deg, #0F1F45 0%, #1B3270 100%); color: #fff; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, rgba(242,100,42,.45), transparent 70%); animation: float 8s ease-in-out infinite; }
  @keyframes float { 50% { transform: translate(-20px, 20px) scale(1.1); } }
  .hero h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.01em; position: relative; z-index: 1; }
  .hero p { margin: 4px 0 0; font-size: 13px; color: #C7D2FE; position: relative; z-index: 1; }
  .tabs { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border-radius: 16px; padding: 5px; margin: -36px 0 14px; box-shadow: var(--shadow); z-index: 2; }
  .tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 10px 6px; font: 600 14px Inter, sans-serif; color: var(--muted); border-radius: 12px; cursor: pointer; transition: color .3s; }
  .tabs button small { display: block; font-weight: 500; font-size: 11px; margin-top: 2px; opacity: .8; }
  .tabs button.on { color: #fff; }
  .tabs .pill { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px); border-radius: 12px; background: linear-gradient(135deg, var(--accent), #FF8A4C); box-shadow: 0 6px 16px rgba(242,100,42,.35); transition: transform .45s cubic-bezier(.65,0,.35,1); }
  .tabs.juft .pill { transform: translateX(100%); }
  .daybar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .daybar button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; cursor: pointer; transition: transform .15s; }
  .daybar button:active { transform: scale(.92); }
  .daybar button:disabled { opacity: .35; }
  .daylabel { text-align: center; flex: 1; }
  .daylabel b { display: block; font-size: 16px; }
  .daylabel span { font-size: 12px; color: var(--muted); }
  .summary { background: var(--card); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 12; stroke-linecap: round; }
  .ring .track { stroke: var(--none-soft); }
  .ring .seg { transition: stroke-dashoffset 1.3s cubic-bezier(.22,1,.36,1), stroke-dasharray 1.3s cubic-bezier(.22,1,.36,1); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring .center b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; }
  .ring .center span { font-size: 11px; color: var(--muted); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { border-radius: 14px; padding: 10px; opacity: 0; transform: translateY(8px); animation: rise .6s forwards; }
  .stat b { display: block; font-size: 22px; font-weight: 800; }
  .stat span { font-size: 11.5px; font-weight: 600; }
  .s-ok { background: var(--ok-soft); color: var(--ok); } .s-warn { background: var(--warn-soft); color: var(--warn); }
  .s-bad { background: var(--bad-soft); color: var(--bad); } .s-none { background: var(--none-soft); color: var(--none); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .note { font-size: 12px; color: var(--muted); margin: 10px 2px 16px; line-height: 1.45; }
  .filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
  .filters button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 12px; font: 600 12.5px Inter, sans-serif; cursor: pointer; transition: all .2s; }
  .filters button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .g { background: var(--card); border-radius: 16px; padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow); opacity: 0; transform: translateY(14px) scale(.98); animation: rise .55s cubic-bezier(.22,1,.36,1) forwards; cursor: pointer; }
  .g .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .g .nm { font-weight: 700; font-size: 14.5px; }
  .g .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .g .pct { font-weight: 800; font-size: 18px; white-space: nowrap; }
  .bar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: var(--none-soft); margin: 10px 0 8px; gap: 2px; }
  .bar i { display: block; height: 100%; width: 0; transition: width 1.1s cubic-bezier(.22,1,.36,1); }
  .bar .b-ok { background: var(--ok); } .bar .b-warn { background: var(--warn); } .bar .b-bad { background: var(--bad); } .bar .b-none { background: var(--none); opacity: .55; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
  .chip { padding: 3px 8px; border-radius: 999px; font-weight: 600; }
  .det { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
  .det > div { overflow: hidden; }
  .g.open .det { grid-template-rows: 1fr; }
  .who { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13px; }
  .badge-nm { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--none-soft); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .person { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .person .row1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
  .person .row1 small { font-weight: 500; }
  .person .mgr { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .note-b { margin-top: 5px; padding: 7px 9px; border-radius: 10px; background: var(--none-soft); font-size: 12.5px; line-height: 1.4; animation: rise .4s both; }
  .note-b b { font-weight: 700; }
  .note-b .src { font-size: 11px; color: var(--muted); }
  .note-b.today { background: var(--ok-soft); }
  .warn-b { margin-top: 5px; font-size: 12px; font-weight: 600; color: var(--bad); }
  .mgrs { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); margin-bottom: 14px; }
  .mgrs h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .mrow { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13.5px; }
  .mrow .nm2 { flex: 1; font-weight: 600; }
  .mrow .mbar { flex: 1.2; height: 8px; border-radius: 6px; background: var(--none-soft); overflow: hidden; }
  .mrow .mbar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width 1s cubic-bezier(.22,1,.36,1); }
  .mrow .cnt { font-weight: 700; min-width: 44px; text-align: right; }
  .empty, .err { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 14px; }
  .sk { height: 86px; border-radius: 16px; margin-bottom: 10px; background: linear-gradient(90deg, var(--card) 25%, var(--none-soft) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  .refresh { position: absolute; right: 14px; top: 14px; z-index: 3; width: 40px; height: 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.12); color: #fff; font-size: 20px; cursor: pointer; backdrop-filter: blur(6px); }
  .refresh.spin span { display: inline-block; animation: rot .8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="hero">
    <h1>📅 Davomat · Edutizim</h1>
    <p id="sub">Kelgan va kelmaganlar — toq va juft kunlar alohida</p>
    <button class="refresh" id="refresh" aria-label="Yangilash"><span>⟳</span></button>
  </div>
  <div class="tabs" id="tabs">
    <span class="pill"></span>
    <button data-k="toq" class="on">Toq kunlar<small>Du · Ch · Ju</small></button>
    <button data-k="juft">Juft kunlar<small>Se · Pa · Sh</small></button>
  </div>
  <div class="daybar">
    <button id="prev" aria-label="Oldingi dars kuni">‹</button>
    <div class="daylabel"><b id="dayName">—</b><span id="dayDate"></span></div>
    <button id="next" aria-label="Keyingi dars kuni">›</button>
  </div>
  <div id="summary"></div>
  <div class="filters" id="filters"></div>
  <div id="list"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<script>
const API = 'https://bbnakgvgoydahagiwltn.supabase.co/functions/v1/edu-app';
const tgw = window.Telegram?.WebApp;
try { tgw?.ready(); tgw?.expand(); if (tgw?.colorScheme) document.documentElement.dataset.theme = tgw.colorScheme; } catch {}
const WD = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];
const PAT = { toq: [1, 3, 5], juft: [2, 4, 6] }; // JS getUTCDay: 0 = Yakshanba
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const state = { kind: 'toq', day: { toq: null, juft: null }, data: null, filter: 'all', today: null };
const $ = id => document.getElementById(id);
const haptic = t => { try { tgw?.HapticFeedback?.selectionChanged(); } catch {} };

function shift(day, dir) {
  const d = new Date(day + 'T00:00:00Z');
  for (let i = 0; i < 7; i++) { d.setUTCDate(d.getUTCDate() + dir); if (PAT[state.kind].includes(d.getUTCDay())) return d.toISOString().slice(0, 10); }
  return day;
}
function countUp(el, to, ms = 1100) {
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms); const e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e) + (el.dataset.suf || ''); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

async function load() {
  const btn = $('refresh'); btn.classList.add('spin');
  $('list').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'attendance', kind: state.kind, day: state.day[state.kind], initData: tgw?.initData || '' }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Xatolik');
    state.data = d; state.today = d.today; state.day[state.kind] = d.day;
    render();
  } catch (e) {
    $('summary').innerHTML = '';
    $('list').innerHTML = `<div class="err">⚠️ ${esc(e.message)}<br><br>Mini App’ni “Registan · Markaz” botidagi “📊 Davomat” tugmasi orqali oching.</div>`;
  } finally { btn.classList.remove('spin'); }
}

function render() {
  const d = state.data, t = d.totals;
  const dt = new Date(d.day + 'T00:00:00Z');
  $('dayName').textContent = WD[dt.getUTCDay()] + (d.day === d.today ? ' · bugun' : '');
  $('dayDate').textContent = d.day.split('-').reverse().join('.') + ` · ${t.groups} guruh (${t.marked} tasi belgilangan)`;
  $('next').disabled = shift(d.day, 1) > d.today;
  if (d.name) $('sub').textContent = `${d.name} · Edutizim ma’lumoti, faqat o‘qiladi`;
  const tot = Math.max(1, t.attended + t.reasonable + t.unreasonable + t.unmarked);
  const pct = Math.round((t.attended / Math.max(1, t.attended + t.reasonable + t.unreasonable)) * 100) || 0;
  const C = 2 * Math.PI * 54;
  const segs = [['var(--ok)', t.attended], ['var(--warn)', t.reasonable], ['var(--bad)', t.unreasonable], ['var(--none)', t.unmarked]];
  let off = 0;
  const arcs = segs.map(([c, v]) => { const len = (v / tot) * C; const s = `<circle class="seg" cx="66" cy="66" r="54" stroke="${c}" stroke-dasharray="0 ${C}" data-len="${len}" data-off="${-off}" stroke-dashoffset="0"/>`; off += len; return s; }).join('');
  $('summary').innerHTML = `
    <div class="summary">
      <div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle class="track" cx="66" cy="66" r="54"/>${arcs}</svg>
        <div class="center"><b data-suf="%" id="pct">0%</b><span>keldi</span></div></div>
      <div class="stats">
        <div class="stat s-ok" style="animation-delay:.05s"><b data-v="${t.attended}">0</b><span>✅ Kelgan</span></div>
        <div class="stat s-bad" style="animation-delay:.12s"><b data-v="${t.unreasonable}">0</b><span>❌ Sababsiz</span></div>
        <div class="stat s-warn" style="animation-delay:.19s"><b data-v="${t.reasonable}">0</b><span>🟡 Sababli</span></div>
        <div class="stat s-none" style="animation-delay:.26s"><b data-v="${t.unmarked}">0</b><span>⏳ Belgilanmagan</span></div>
      </div>
    </div>
    <div class="note">Jami ${t.total} o‘quvchi. Foiz — davomat qilinganlar ichida kelganlar ulushi. “Belgilanmagan” — ustoz Edutizim’da hali davomat qilmagan o‘quvchilar. Guruhni bosib ro‘yxatni oching.</div>
    ${t.absent ? `<div class="mgrs"><h3>📞 Menejer izohlari (shu kuni): <b style="color:var(--ink)">${t.noted}/${t.absent}</b></h3>
      ${(d.managers || []).map(m => `<div class="mrow"><span class="nm2">${m.done === m.n ? '✅' : '⏳'} ${esc(m.name)}</span><span class="mbar"><i data-w="${m.n ? m.done / m.n * 100 : 0}"></i></span><span class="cnt">${m.done}/${m.n}</span></div>`).join('')}</div>` : ''}`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.ring .seg').forEach(c => { c.setAttribute('stroke-dasharray', `${c.dataset.len} ${C}`); c.setAttribute('stroke-dashoffset', c.dataset.off); });
    countUp($('pct'), pct);
    setTimeout(() => document.querySelectorAll('.mbar i').forEach(b => { b.style.width = b.dataset.w + '%'; }), 150);
    document.querySelectorAll('.stat b').forEach(b => countUp(b, Number(b.dataset.v)));
  }));
  const F = [['all', 'Hammasi'], ['absent', `Kelmaganlar bor (${d.groups.filter(g => g.unreasonable + g.reasonable).length})`], ['unmarked', `Belgilanmagan (${d.groups.filter(g => g.unmarked).length})`], ['nonote', `Izohsiz (${d.groups.filter(g => g.absentList.some(x => !x.noted)).length})`]];
  $('filters').innerHTML = F.map(([k, l]) => `<button data-f="${k}" class="${state.filter === k ? 'on' : ''}">${l}</button>`).join('');
  const gs = d.groups.filter(g => state.filter === 'all' || (state.filter === 'absent' ? g.unreasonable + g.reasonable > 0 : state.filter === 'nonote' ? g.absentList.some(x => !x.noted) : g.unmarked > 0));
  if (!gs.length) { $('list').innerHTML = `<div class="empty">${d.groups.length ? 'Bu filtr bo‘yicha guruh yo‘q 🎉' : 'Bu kunda dars yo‘q.'}</div>`; return; }
  $('list').innerHTML = gs.map((g, i) => {
    const den = Math.max(1, g.attended + g.reasonable + g.unreasonable + g.unmarked);
    const p = g.marked ? Math.round(g.attended / Math.max(1, g.attended + g.reasonable + g.unreasonable) * 100) : null;
    const col = p === null ? 'var(--none)' : p >= 85 ? 'var(--ok)' : p >= 60 ? 'var(--warn)' : 'var(--bad)';
    const fmtAt = a => { if (!a) return ''; const x = new Date(new Date(a).getTime() + 5 * 3600e3); return `${String(x.getUTCDate()).padStart(2, '0')}.${String(x.getUTCMonth() + 1).padStart(2, '0')} ${String(x.getUTCHours()).padStart(2, '0')}:${String(x.getUTCMinutes()).padStart(2, '0')}`; };
    const SRC = { bot: '🤖 bot orqali', ustoz: '👩‍🏫 ustoz', edutizim: '🗂 Edutizim' };
    const who = [
      ...g.absentList.map(s => `<div class="person"><div class="row1"><span>${s.st === 'unreasonable' ? '❌' : '🟡'} ${esc(s.name)}</span><small style="color:${s.st === 'unreasonable' ? 'var(--bad)' : 'var(--warn)'}">${esc(s.reason || (s.st === 'unreasonable' ? 'sababsiz' : 'sababli'))}</small></div>
        <div class="mgr">👤 Mas’ul menejer: <b>${esc(s.manager || '—')}</b></div>
        ${(s.notes || []).map(n => `<div class="note-b ${s.noted ? 'today' : ''}">💬 ${esc(n.text)}<div class="src"><b>${esc(n.who)}</b> · ${SRC[n.via] || ''} · ${fmtAt(n.at)}</div></div>`).join('')}
        ${s.noted ? '' : `<div class="warn-b">⚠️ Shu kuni izoh yozilmagan${(s.notes || []).length ? ' (yuqorida — oldingi izoh)' : ''}</div>`}</div>`),
      ...g.unmarkedList.map(s => `<div class="person"><div class="row1"><span>⏳ ${esc(s.name)}</span><small style="color:var(--muted)">belgilanmagan</small></div>${s.manager ? `<div class="mgr">👤 Mas’ul menejer: <b>${esc(s.manager)}</b></div>` : ''}</div>`)
    ].join('') || '<div class="person"><div class="row1"><span>✅ Hamma keldi</span></div></div>';
    return `<div class="g" style="animation-delay:${Math.min(i * 0.06, 0.9)}s" data-i="${i}">
      <div class="top"><div><div class="nm">${esc(g.name)}${g.marked ? '' : '<span class="badge-nm">davomat qilinmagan</span>'}</div>
        <div class="meta">${esc(g.start)}–${esc(g.end)} · ${esc(g.room)} · ${esc(g.teacher)}</div></div>
        <div class="pct" style="color:${col}">${p === null ? '—' : p + '%'}</div></div>
      <div class="bar"><i class="b-ok" data-w="${g.attended / den * 100}"></i><i class="b-warn" data-w="${g.reasonable / den * 100}"></i><i class="b-bad" data-w="${g.unreasonable / den * 100}"></i><i class="b-none" data-w="${g.unmarked / den * 100}"></i></div>
      <div class="chips"><span class="chip s-ok">✅ ${g.attended}</span>${g.unreasonable ? `<span class="chip s-bad">❌ ${g.unreasonable}</span>` : ''}${g.reasonable ? `<span class="chip s-warn">🟡 ${g.reasonable}</span>` : ''}${g.unmarked ? `<span class="chip s-none">⏳ ${g.unmarked}</span>` : ''}${g.absentList.length ? `<span class="chip ${g.noted === g.absentList.length ? 's-ok' : 's-bad'}">💬 ${g.noted}/${g.absentList.length}</span>` : ''}<span class="chip" style="color:var(--muted)">${g.total} o‘quvchi</span></div>
      <div class="det"><div><div class="who">${who}</div></div></div>
    </div>`;
  }).join('');
  setTimeout(() => document.querySelectorAll('.bar i').forEach(b => { b.style.width = b.dataset.w + '%'; }), 120);
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.k === state.kind) return;
  haptic(); state.kind = b.dataset.k; state.filter = 'all';
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('tabs').classList.toggle('juft', state.kind === 'juft');
  load();
});
$('prev').onclick = () => { if (!state.data) return; haptic(); state.day[state.kind] = shift(state.data.day, -1); load(); };
$('next').onclick = () => { if (!state.data) return; const n = shift(state.data.day, 1); if (n > state.today) return; haptic(); state.day[state.kind] = n; load(); };
$('refresh').onclick = () => { haptic(); load(); };
$('filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; haptic(); state.filter = b.dataset.f; render(); });
$('list').addEventListener('click', e => { const g = e.target.closest('.g'); if (g) { haptic(); g.classList.toggle('open'); } });
// Bugungi kun turini avtomatik tanlash (Du/Ch/Ju → toq, Se/Pa/Sh → juft)
