<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Kitobxonlik Akademiyasi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #fbf8f1);
      --bg2: var(--tg-theme-secondary-bg-color, #f3ecdd);
      --text: var(--tg-theme-text-color, #1f2a37);
      --hint: var(--tg-theme-hint-color, #7b8491);
      --link: var(--tg-theme-link-color, #9c6f1e);
      --btn: var(--tg-theme-button-color, #b8892d);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --gold: #b8892d;
      --radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .app { max-width: 640px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
    header { padding: 16px 16px 8px; }
    .brand { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
    h1 { margin: 4px 0 0; font-size: 20px; }
    .tabs { display: flex; gap: 6px; padding: 8px 16px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
    .tabs button { flex: 1; border: 0; padding: 9px 6px; border-radius: 12px; background: var(--bg2); color: var(--text); font-weight: 700; font-size: 13px; }
    .tabs button.on { background: var(--btn); color: var(--btn-text); }
    main { flex: 1; padding: 8px 16px 24px; }
    .card { background: var(--bg2); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat { background: var(--bg2); border-radius: 14px; padding: 12px 8px; text-align: center; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: var(--hint); }
    .muted { color: var(--hint); font-size: 13px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 14px; background: var(--btn); color: var(--btn-text); font-weight: 700; font-size: 14px; }
    .btn.ghost { background: transparent; color: var(--link); padding: 6px 8px; }
    .title { font-weight: 800; }
    .pill { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(184,137,45,.15); color: var(--gold); }
    .section { font-size: 13px; font-weight: 800; color: var(--hint); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 8px; }
    input { width: 100%; border: 1px solid rgba(127,127,127,.3); background: var(--bg); color: var(--text); border-radius: 12px; padding: 11px 12px; font-size: 15px; }
    /* Chat */
    .chat { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 20; }
    .chat.on { display: flex; }
    .chat-head { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(127,127,127,.15); }
    .msgs { flex: 1; overflow-y: auto; padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 82%; padding: 8px 11px; border-radius: 14px; background: var(--bg2); align-self: flex-start; word-wrap: break-word; white-space: pre-wrap; }
    .msg.mine { align-self: flex-end; background: var(--btn); color: var(--btn-text); }
    .msg .who { font-size: 12px; font-weight: 800; color: var(--gold); margin-bottom: 2px; }
    .msg.mine .who { display: none; }
    .msg .t { font-size: 10px; opacity: .65; text-align: right; margin-top: 2px; }
    .msg.del { font-style: italic; opacity: .6; }
    .composer { display: flex; gap: 8px; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(127,127,127,.15); }
    .composer input { flex: 1; }
    .empty { text-align: center; padding: 30px 10px; color: var(--hint); }
    .day { align-self: center; font-size: 11px; color: var(--hint); background: var(--bg2); padding: 2px 10px; border-radius: 999px; margin: 6px 0; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Laylo Pardayeva · Kitobxonlik Akademiyasi</div>
    <h1 id="hello">Yuklanmoqda…</h1>
  </header>
  <nav class="tabs">
    <button data-tab="home" class="on">🏠 Bosh</button>
    <button data-tab="groups">👥 Guruhlar</button>
    <button data-tab="meet">🎥 Uchrashuvlar</button>
  </nav>
  <main id="main"><div class="empty">⏳</div></main>
</div>

<div class="chat" id="chat">
  <div class="chat-head">
    <button class="btn ghost" onclick="closeChat()">← Orqaga</button>
    <div class="grow"><div class="title" id="chat-title"></div><div class="muted" id="chat-sub">Guruh chati</div></div>
  </div>
  <div class="msgs" id="msgs"></div>
  <form class="composer" onsubmit="sendMsg(event)">
    <input id="msg-input" maxlength="2000" placeholder="Xabar yozing…" autocomplete="off">
    <button class="btn" type="submit">➤</button>
  </form>
</div>

<script>
  const tgApp = window.Telegram?.WebApp;
  tgApp?.ready(); tgApp?.expand();
  const API = `${window.KA_CONFIG.SUPABASE_URL}/functions/v1/ka-miniapp`;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d => new Date(d).toLocaleString('uz-UZ', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
  const time = d => new Date(d).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
  let state = null, tab = 'home', chat = null, poll = null;

  async function api(action, extra = {}) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: window.KA_CONFIG.SUPABASE_KEY },
      body: JSON.stringify({ action, initData: tgApp?.initData || '', ...extra })
    });
    return res.json().catch(() => ({ ok: false, error: 'Tarmoq xatosi' }));
  }

  async function load() {
    const r = await api('me');
    const main = document.getElementById('main');
    if (!r.ok) {
      document.getElementById('hello').textContent = 'Kitobxonlik Akademiyasi';
      main.innerHTML = r.error === 'not_registered'
        ? '<div class="card">👋 Avval botda ro‘yxatdan o‘ting: botga qaytib <b>/start</b> bosing.</div>'
        : `<div class="card">⚠️ ${esc(r.error)}</div>`;
      return;
    }
    state = r;
    document.getElementById('hello').textContent = `Salom, ${r.member.full_name.split(' ')[0]}!`;
    render();
    const g = new URLSearchParams(location.search).get('g') || tgApp?.initDataUnsafe?.start_param?.replace(/^g/, '');
    if (g && state.groups.some(x => String(x.id) === String(g))) openChat(Number(g));
  }

  function meetingCard(m) {
    const g = state.groups.find(x => x.id === m.group_id);
    const start = new Date(m.starts_at).getTime();
    const live = Date.now() >= start - 10 * 60000;
    return `<div class="card">
      <div class="row"><div class="grow">
        <div class="title">🎥 ${esc(m.title)}</div>
        <div class="muted">${esc(g?.name || '')} · ${fmt(m.starts_at)} · ${m.duration_min} daq.</div>
        ${m.notes ? `<div class="muted" style="margin-top:4px">${esc(m.notes)}</div>` : ''}
      </div></div>
      <div style="margin-top:10px"><button class="btn" onclick="openMeet('${esc(m.url)}')">${live ? '🟢 Kirish' : '🔗 Havola'}</button></div>
    </div>`;
  }

  function render() {
    const main = document.getElementById('main');
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    if (tab === 'home') {
      const ms = state.membership;
      main.innerHTML = `
        <div class="stats">
          <div class="stat"><b>${state.stats.points}</b><span>ball</span></div>
          <div class="stat"><b>${state.stats.books}</b><span>kitob</span></div>
          <div class="stat"><b>${state.stats.contests}</b><span>tanlov</span></div>
        </div>
        ${ms.enabled ? `<div class="card" style="margin-top:10px">💳 A’zolik: ${ms.paid ? `<b>faol</b> · ${fmt(state.member.paid_until)} gacha` : '<b>faol emas</b> — botda /azolik'}</div>` : ''}
        <div class="section">Yaqin uchrashuvlar</div>
        ${state.meetings.slice(0, 2).map(meetingCard).join('') || '<div class="card muted">Rejalashtirilgan uchrashuv yo‘q.</div>'}
        <div class="section">Guruhlarim</div>
        ${groupList()}
        <div class="card muted">📚 Kitoblar, testlar, audio taqriz va sertifikatlar — botning o‘zida.</div>`;
    } else if (tab === 'groups') {
      main.innerHTML = `
        <div class="section">Guruhlarim</div>${groupList()}
        <div class="section">Kod bilan qo‘shilish</div>
        <div class="card"><form class="row" onsubmit="joinCode(event)"><input id="code" placeholder="Masalan: A1B2C3" maxlength="12" style="text-transform:uppercase"><button class="btn">Qo‘shilish</button></form></div>
        ${state.openGroups.length ? `<div class="section">Ochiq guruhlar</div>${state.openGroups.map(g => `
          <div class="card row"><div class="grow"><div class="title">${g.premium ? '🔒 ' : ''}${esc(g.name)}</div><div class="muted">${esc(g.book?.title ? '📖 ' + g.book.title : g.description || '')}</div></div>
          <button class="btn" onclick="joinOpen(${g.id})">＋</button></div>`).join('')}` : ''}`;
    } else {
      main.innerHTML = state.meetings.map(meetingCard).join('') || '<div class="empty">📅 Hozircha uchrashuv rejalashtirilmagan.<br>Guruh ustozi uchrashuv belgilasa, bot eslatadi.</div>';
    }
  }

  function groupList() {
    if (!state.groups.length) return '<div class="card muted">Hali guruhda emassiz. “👥 Guruhlar” bo‘limidan qo‘shiling.</div>';
    return state.groups.map(g => `
      <div class="card row" onclick="${g.locked ? '' : `openChat(${g.id})`}">
        <div class="grow"><div class="title">${esc(g.name)} ${g.locked ? '<span class="pill">🔒 pullik</span>' : ''}</div>
        <div class="muted">${g.book?.title ? `📖 ${esc(g.book.title)}` : esc(g.description || '')}</div></div>
        ${g.locked ? '' : '<span class="btn ghost">💬 Chat ›</span>'}
      </div>`).join('');
  }

  function openMeet(url) {
    if (tgApp?.openLink) tgApp.openLink(url); else window.open(url, '_blank');
  }

  async function joinCode(e) {
    e.preventDefault();
    const code = document.getElementById('code').value.trim();
    if (!code) return;
    const r = await api('join', { code });
    if (!r.ok) return alertMsg(r.error);
    await load(); tab = 'groups'; render(); openChat(r.groupId);
  }
  async function joinOpen(id) {
    const r = await api('join', { groupId: id });
    if (!r.ok) return alertMsg(r.error);
    await load(); openChat(r.groupId);
  }
  function alertMsg(t) { if (tgApp?.showAlert) tgApp.showAlert(t); else alert(t); }

  // ---------------- Chat ----------------
  async function openChat(id) {
    const g = state.groups.find(x => x.id === id);
    chat = { id, last: 0, lastDay: '' };
    document.getElementById('chat-title').textContent = g?.name || 'Guruh';
    document.getElementById('msgs').innerHTML = '<div class="empty">⏳</div>';
    document.getElementById('chat').classList.add('on');
    tgApp?.BackButton?.show();
    await fetchMsgs(true);
    clearInterval(poll);
    poll = setInterval(() => { if (!document.hidden) fetchMsgs(); }, 3000);
  }
  function closeChat() {
    clearInterval(poll); chat = null;
    document.getElementById('chat').classList.remove('on');
    tgApp?.BackButton?.hide();
  }
  tgApp?.BackButton?.onClick(closeChat);

  async function fetchMsgs(first = false) {
    if (!chat) return;
    const id = chat.id;
    const r = await api('messages', { groupId: id, after: first ? 0 : chat.last });
    if (!chat || chat.id !== id) return;
    const box = document.getElementById('msgs');
    if (!r.ok) { box.innerHTML = `<div class="empty">⚠️ ${esc(r.error)}</div>`; return; }
    if (first) box.innerHTML = r.messages.length ? '' : '<div class="empty" id="no-msg">Hali xabar yo‘q. Birinchi bo‘lib yozing! ✍️</div>';
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    r.messages.forEach(m => addMsg(m));
    if (r.messages.length && (first || atBottom)) box.scrollTop = box.scrollHeight;
  }
  function addMsg(m) {
    if (document.getElementById('m' + m.id)) return;
    document.getElementById('no-msg')?.remove();
    const box = document.getElementById('msgs');
    const day = new Date(m.at).toLocaleDateString('uz-UZ');
    if (day !== chat.lastDay) { box.insertAdjacentHTML('beforeend', `<div class="day">${day}</div>`); chat.lastDay = day; }
    box.insertAdjacentHTML('beforeend', `<div class="msg ${m.mine ? 'mine' : ''} ${m.text === null ? 'del' : ''}" id="m${m.id}">
      <div class="who">${m.staff ? '🎓 ' : ''}${esc(m.author)}</div>${m.text === null ? 'Xabar o‘chirildi' : esc(m.text)}<div class="t">${time(m.at)}</div></div>`);
    chat.last = Math.max(chat.last, m.id);
  }
  async function sendMsg(e) {
    e.preventDefault();
    const inp = document.getElementById('msg-input');
    const text = inp.value.trim();
    if (!text || !chat) return;
    inp.value = '';
    const r = await api('send', { groupId: chat.id, text });
    if (!r.ok) { inp.value = text; return alertMsg(r.error); }
    await fetchMsgs();
    const box = document.getElementById('msgs'); box.scrollTop = box.scrollHeight;
  }

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  load();
</script>
</body>
</html>
