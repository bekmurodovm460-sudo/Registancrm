# 🎬 AI montaj: navbatdagi loyihalardan videoni ffmpeg bilan yasaydi va bot chatiga yuboradi.
# Supabase'ga GitHub OIDC tokeni bilan ulanadi — repo'da maxfiy kalit saqlanmaydi.
name: AI video render

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: ai-video-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            render
            brand
      - name: Navbatni tekshirish
        id: q
        run: |
          TOKEN=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registan-render" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          N=$(curl -sf -X POST -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" -d '{"action":"renderPending"}' https://bbnakgvgoydahagiwltn.supabase.co/functions/v1/edu-app | python3 -c 'import json,sys; print(json.load(sys.stdin).get("count",0))')
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "Navbatda: $N"
      - name: ffmpeg o'rnatish
        if: steps.q.outputs.count != '0'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Videolarni yasash
        if: steps.q.outputs.count != '0'
        run: python3 render/render.py
